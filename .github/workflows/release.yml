name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # electron-builder publishes the release itself rather than uploading the
      # exes separately, because the updater needs latest.yml and the .blockmap
      # alongside them and those are easy to leave out by hand.
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run desktop:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual runs build without publishing, so the artifacts can be checked.
      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: pu-toolset-windows
          path: |
            release/*.exe
            release/latest.yml
